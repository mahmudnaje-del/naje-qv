  <body class="bg-gray-50 dark:bg-[#0f1115] text-gray-900 dark:text-gray-100 font-sans antialiased selection:bg-indigo-500/30">
    <div id="root"></div>
    <script>
      // Self-heal: if the app root is still empty after 8s, a stale SW likely
      // broke the load — unregister SWs, clear caches, reload once.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0 && !sessionStorage.getItem('naje_selfheal')) {
          sessionStorage.setItem('naje_selfheal', '1');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches) { caches.keys().then(function (ks){ ks.forEach(function(k){ caches.delete(k); }); }); }
          location.reload();
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
