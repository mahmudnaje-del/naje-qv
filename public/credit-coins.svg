<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 390 690 490" width="690" height="490" role="img" aria-label="Naje credit coins">
  <defs>
    <!-- coin side (stack) -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A61C"/>
      <stop offset="0.3" stop-color="#FBC934"/>
      <stop offset="0.7" stop-color="#E29A16"/>
      <stop offset="1" stop-color="#A9670A"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE68A" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFE68A" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A4300" stop-opacity="0.35"/>
    </linearGradient>
    <!-- coin top face -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE47C"/>
      <stop offset="1" stop-color="#F6BE33"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD654"/>
      <stop offset="1" stop-color="#F3B62D"/>
    </linearGradient>
    <!-- leaning coin -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B96F0B"/>
      <stop offset="1" stop-color="#F0AE20"/>
    </linearGradient>
    <linearGradient id="bigRim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFE889"/>
      <stop offset="0.55" stop-color="#FBCB3F"/>
      <stop offset="1" stop-color="#EDA820"/>
    </linearGradient>
    <linearGradient id="bigFace" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FCD452"/>
      <stop offset="1" stop-color="#EBA824"/>
    </linearGradient>
    <!-- logo blocks -->
    <linearGradient id="purple" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C4DEB"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFE96A"/>
      <stop offset="1" stop-color="#F4C61F"/>
    </linearGradient>

    <!-- one coin of the stack: top-face centre at (0,0) -->
    <g id="coin">
      <path id="sidePath" d="M-168 0 V98 A168 58 0 0 0 168 98 V0 Z" fill="url(#side)"/>
      <path d="M-168 0 V98 A168 58 0 0 0 168 98 V0 Z" fill="url(#sideShade)"/>
      <ellipse cx="0" cy="0" rx="168" ry="58" fill="url(#rim)"/>
      <ellipse cx="0" cy="3" rx="138" ry="43" fill="url(#face)"/>
      <ellipse cx="0" cy="3" rx="138" ry="43" fill="none" stroke="#E9A823" stroke-opacity="0.45" stroke-width="3"/>
    </g>
  </defs>

  <!-- stack of three coins (bottom to top) -->
  <use href="#coin" transform="translate(486,690)"/>
  <use href="#coin" transform="translate(496,584)"/>
  <use href="#coin" transform="translate(514,478)"/>

  <!-- leaning coin -->
  <g transform="rotate(10 760 632)">
    <!-- thickness -->
    <rect x="742" y="420" width="40" height="432" fill="url(#edge)"/>
    <ellipse cx="742" cy="636" rx="172" ry="216" fill="url(#edge)"/>
    <!-- face -->
    <ellipse cx="782" cy="636" rx="172" ry="216" fill="url(#bigRim)"/>
    <ellipse cx="782" cy="636" rx="142" ry="184" fill="url(#bigFace)"/>
    <ellipse cx="782" cy="636" rx="142" ry="184" fill="none" stroke="#FFE27A" stroke-opacity="0.7" stroke-width="3"/>
  </g>

  <!-- logo on the coin -->
  <g>
    <rect x="667" y="540" width="52" height="52" rx="13" transform="rotate(-8 693 566)" fill="url(#purple)"/>
    <rect x="683" y="603" width="52" height="52" rx="13" transform="rotate(-8 709 629)" fill="url(#purple)"/>
    <rect x="699" y="667" width="52" height="52" rx="13" transform="rotate(-8 725 693)" fill="url(#purple)"/>
    <rect x="816" y="520" width="52" height="52" rx="13" transform="rotate(-8 842 546)" fill="url(#purple)"/>
    <rect x="832" y="583" width="52" height="52" rx="13" transform="rotate(-8 858 609)" fill="url(#purple)"/>
    <rect x="848" y="647" width="52" height="52" rx="13" transform="rotate(-8 874 673)" fill="url(#purple)"/>
    <rect x="738" y="591" width="42" height="42" rx="11" transform="rotate(-8 759 612)" fill="url(#yellow)"/>
    <rect x="786" y="616" width="42" height="42" rx="11" transform="rotate(-8 807 637)" fill="url(#yellow)"/>
  </g>
</svg>
