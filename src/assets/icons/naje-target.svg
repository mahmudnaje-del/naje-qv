<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="najeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="najeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="najeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#4338ca" flood-opacity="0.55"/>
    </filter>
  </defs>
  <g filter="url(#najeGlow)">
  
  <g transform="translate(24,24)">
    <circle r="18" fill="none" stroke="url(#najeGrad)" stroke-width="4"/>
    <circle r="10" fill="none" stroke="url(#najeGrad)" stroke-width="4"/>
    <circle r="3" fill="url(#najeGold)"><animate attributeName="r" values="3;4.5;3" dur="1.3s" repeatCount="indefinite"/></circle>
  </g>
  </g>
</svg>