<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="najeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="najeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="najeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#4338ca" flood-opacity="0.55"/>
    </filter>
  </defs>
  
  <g filter="url(#najeGlow)">
<g transform="translate(24,24)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    <g fill="url(#najeGrad)">
      <circle r="7"/>
      <g id="teeth"></g>
      <rect x="-2.5" y="-18" width="5" height="8" rx="1.5"/>
      <rect x="-2.5" y="10" width="5" height="8" rx="1.5"/>
      <rect x="-18" y="-2.5" width="8" height="5" rx="1.5"/>
      <rect x="10" y="-2.5" width="8" height="5" rx="1.5"/>
      <rect x="-2.5" y="-18" width="5" height="8" rx="1.5" transform="rotate(45)"/>
      <rect x="-2.5" y="10" width="5" height="8" rx="1.5" transform="rotate(45)"/>
      <rect x="-18" y="-2.5" width="8" height="5" rx="1.5" transform="rotate(45)"/>
      <rect x="10" y="-2.5" width="8" height="5" rx="1.5" transform="rotate(45)"/>
    </g>
    <circle r="3" fill="#fff"/>
  </g>

</g>
</svg>