<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="najeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="najeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="najeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#4338ca" flood-opacity="0.55"/>
    </filter>
  </defs>
  
  <g filter="url(#najeGlow)">
<g transform="translate(21,21)">
    <circle r="11" fill="none" stroke="url(#najeGrad)" stroke-width="4"/>
    <line x1="8" y1="8" x2="19" y2="19" stroke="url(#najeGold)" stroke-width="4" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="0 21 21;-12 21 21;0 21 21" dur="1.8s" repeatCount="indefinite" additive="sum"/>
  </g>

</g>
</svg>